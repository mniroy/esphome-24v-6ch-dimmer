substitutions:
  device_name: "dimmer-6ch-24v-lan"
  friendly_name: "24V 6-CH LED Dimmer (LAN)"
  pwm_frequency: "19531 Hz" # Flicker-free & silent (>19kHz)
  transition_time: "600ms"  # Smooth IKEA SILVERGLANS-style soft on/off

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "24V DC 6-Channel LAN ESPHome LED Dimmer (REV 1.1 - 2026-11-18)"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Wired LAN / Ethernet (W5500 SPI Controller)
ethernet:
  type: W5500
  clk_pin: GPIO14
  mosi_pin: GPIO26
  miso_pin: GPIO25
  cs_pin: GPIO27
  interrupt_pin: GPIO33
  reset_pin: GPIO32

web_server:
  port: 80

# Hardware LEDC PWM Outputs (12-bit @ 19.53 kHz)
output:
  - platform: ledc
    pin: GPIO16
    id: pwm_ch1
    frequency: ${pwm_frequency}

  - platform: ledc
    pin: GPIO17
    id: pwm_ch2
    frequency: ${pwm_frequency}

  - platform: ledc
    pin: GPIO18
    id: pwm_ch3
    frequency: ${pwm_frequency}

  - platform: ledc
    pin: GPIO19
    id: pwm_ch4
    frequency: ${pwm_frequency}

  - platform: ledc
    pin: GPIO21
    id: pwm_ch5
    frequency: ${pwm_frequency}

  - platform: ledc
    pin: GPIO22
    id: pwm_ch6
    frequency: ${pwm_frequency}

# 6 Independent Dimmable Light Channels (IKEA SILVERGLANS Behavior)
light:
  - platform: monochromatic
    name: "Channel 1"
    id: light_ch1
    output: pwm_ch1
    gamma_correct: 2.8
    default_transition_length: ${transition_time}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: monochromatic
    name: "Channel 2"
    id: light_ch2
    output: pwm_ch2
    gamma_correct: 2.8
    default_transition_length: ${transition_time}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: monochromatic
    name: "Channel 3"
    id: light_ch3
    output: pwm_ch3
    gamma_correct: 2.8
    default_transition_length: ${transition_time}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: monochromatic
    name: "Channel 4"
    id: light_ch4
    output: pwm_ch4
    gamma_correct: 2.8
    default_transition_length: ${transition_time}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: monochromatic
    name: "Channel 5"
    id: light_ch5
    output: pwm_ch5
    gamma_correct: 2.8
    default_transition_length: ${transition_time}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: monochromatic
    name: "Channel 6"
    id: light_ch6
    output: pwm_ch6
    gamma_correct: 2.8
    default_transition_length: ${transition_time}
    restore_mode: RESTORE_DEFAULT_OFF
